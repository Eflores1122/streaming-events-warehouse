name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      ANDENSUR_REQUIRE_REDIS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest
      - name: Generator and consumer smoke test
        run: >
          python -m andensur demo
          --orders 40
          --seed 42
          --fresh
          --broker stand-in
          --warehouse "${{ runner.temp }}/andensur.duckdb"
          --archive "${{ runner.temp }}/events.jsonl"
          --standin-root "${{ runner.temp }}/standin"
