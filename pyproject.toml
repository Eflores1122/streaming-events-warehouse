[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "andensur-streaming"
version = "0.1.0"
description = "Streaming ingestion reference for a fictitious Mexican e-commerce fulfillment floor. Synthetic events only."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Edgar Flores" }]
keywords = ["streaming", "duckdb", "redis", "bigquery", "synthetic-data"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
]
dependencies = [
  "duckdb>=1.1,<2",
]

[project.optional-dependencies]
redis = ["redis>=5"]
dev = [
  "pytest>=8",
  "redis>=5",
  "ruff>=0.6",
]

[project.scripts]
andensur = "andensur.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
andensur = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "dags"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
