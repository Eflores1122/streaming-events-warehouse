name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      ANDENSUR_REQUIRE_REDIS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest
      - name: Generator and consumer smoke test
        run: >
          python -m andensur demo
          --orders 40
          --seed 42
          --fresh
          --broker stand-in
          --warehouse "${{ runner.temp }}/andensur.duckdb"
          --archive "${{ runner.temp }}/events.jsonl"
          --standin-root "${{ runner.temp }}/standin"

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          npm ci --prefix site
      - name: Generator port matches Python
        run: |
          set -euo pipefail
          for spec in "1 42" "2 42" "40 7" "120 42"; do
            set -- $spec
            python -m andensur generate --orders "$1" --seed "$2" --archive "${{ runner.temp }}/py.jsonl"
            node site/scripts/dump-events.mjs "$1" "$2" "${{ runner.temp }}/js.jsonl"
            diff -u "${{ runner.temp }}/py.jsonl" "${{ runner.temp }}/js.jsonl"
          done
      - name: Build site
        working-directory: site
        run: npm run build
